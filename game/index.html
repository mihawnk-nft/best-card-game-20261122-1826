<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emberfall Duel — a card duel of Ember, Thorn &amp; Tide</title>
<style>
  :root {
    --backdrop: #14100c;
    --table: #241a12;
    --panel: #1d150e;
    --edge: #4a3520;
    --text: #f5ead6;
    --muted: #b39b78;
    --gold: #f2c94c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--backdrop); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app { height: 100%; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  button { font-family: inherit; cursor: pointer; }

  /* ---------- shared ---------- */
  .screen { height: 100%; display: flex; flex-direction: column; }
  .big-button {
    background: linear-gradient(180deg, #f2c94c, #d9a521);
    color: #241a12; border: none; border-radius: 12px;
    font-family: Georgia, "Times New Roman", serif; font-size: 22px; font-weight: bold;
    padding: 14px 42px; box-shadow: 0 4px 0 #8a6d1f, 0 8px 24px rgba(0,0,0,.5);
  }
  .big-button:hover { filter: brightness(1.08); }
  .big-button:active { transform: translateY(2px); box-shadow: 0 2px 0 #8a6d1f; }
  .hint { color: var(--muted); font-size: 13px; }

  /* ---------- title ---------- */
  .title-screen { align-items: center; justify-content: center; text-align: center; overflow-y: auto;
    background: radial-gradient(ellipse at 50% 20%, #3d2a16 0%, #14100c 65%); }
  .title-inner { max-width: 860px; padding: 24px; }
  .title-kicker { letter-spacing: .3em; text-transform: uppercase; color: var(--gold); font-size: 13px; }
  .title-screen h1 {
    font-family: Georgia, "Times New Roman", serif; font-size: 76px; line-height: .95; margin: 12px 0;
    background: linear-gradient(180deg, #ffe8a3, #e8590c 55%, #a61e4d);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 42px rgba(232, 89, 12, .25);
  }
  .tagline { font-family: Georgia, serif; font-size: 19px; color: var(--text); margin: 6px 0 18px; }
  .sample-cards { display: flex; gap: 14px; justify-content: center; margin: 10px 0 16px; }
  .sample-cards .card { cursor: default; }
  .triangle { display: flex; gap: 8px; align-items: center; justify-content: center; margin: 8px 0 18px; flex-wrap: wrap; }
  .tri-chip { border: 2px solid var(--ac); color: var(--ac); border-radius: 999px; padding: 3px 12px; font-weight: bold; font-size: 13px; background: rgba(0,0,0,.35); }
  .tri-beats { color: var(--muted); font-weight: bold; }
  .tri-note { color: var(--muted); font-size: 12px; font-style: italic; }
  .howto { max-width: 640px; margin: 18px auto 0; font-size: 14px; line-height: 1.55; color: var(--muted); }
  .howto strong { color: var(--text); }
  .best { color: var(--gold); font-weight: bold; }

  /* ---------- play table ---------- */
  .play-screen { background: radial-gradient(ellipse at 50% 0%, #332415 0%, var(--backdrop) 70%); padding: 10px 18px; gap: 6px; }
  .topbar { display: flex; align-items: center; gap: 16px; }
  .turn-box { flex: 1; text-align: center; }
  .turn-label { display: block; font-family: Georgia, serif; font-size: 15px; color: var(--gold); letter-spacing: .12em; text-transform: uppercase; }
  .banner { font-size: 14px; color: var(--muted); }
  .mute-button { background: var(--panel); color: var(--text); border: 1px solid var(--edge); border-radius: 8px; padding: 6px 12px; font-size: 13px; }

  .hero { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; padding: 6px 12px; min-width: 300px; }
  .hero.foe { border-color: #7048e8; }
  .hero.mine { border-color: #e8590c; }
  .portrait {
    width: 44px; height: 44px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center;
    background: var(--pc); color: #fff; font-family: Georgia, serif; font-size: 24px; font-weight: bold;
    box-shadow: 0 0 0 2px rgba(255,255,255,.25), 0 0 18px var(--pc);
  }
  .hero-info { display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .hero-name { font-family: Georgia, serif; font-size: 15px; font-weight: bold; }
  .hero-stats { display: flex; align-items: center; gap: 10px; }
  .lifebar { position: relative; display: inline-block; width: 130px; height: 18px; background: #3a0d0d; border-radius: 999px; overflow: hidden; border: 1px solid #7f1d1d; }
  .lifefill { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #e03131, #ff6b6b); }
  .lifenumber { position: relative; z-index: 1; display: block; text-align: center; font-size: 12px; font-weight: bold; line-height: 18px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.8); }
  .crystals { display: inline-flex; gap: 3px; align-items: center; }
  .crystal { width: 9px; height: 9px; border-radius: 50%; background: #1c4a6e; border: 1px solid #339af0; }
  .crystal.on { background: #339af0; box-shadow: 0 0 6px #339af0; }
  .crystal.locked { opacity: .25; }
  .deck-count { font-size: 12px; color: var(--muted); white-space: nowrap; }

  .enemy-hand { display: flex; gap: 4px; justify-content: center; min-height: 30px; }
  .enemy-hand .card.back { width: 34px; height: 46px; }
  .enemy-hand .card.back .back-mark { font-size: 16px; }

  .board-row { display: flex; gap: 10px; justify-content: center; align-items: center; min-height: 150px; flex: 1;
    background: rgba(0,0,0,.22); border: 1px dashed rgba(245,234,214,.12); border-radius: 14px; padding: 6px; }
  .board-row.foe-row { border-color: rgba(112,72,232,.35); }
  .empty-board { color: var(--muted); font-size: 13px; font-style: italic; }

  .midbar { display: flex; gap: 14px; align-items: center; }
  .log { flex: 1; font-size: 12.5px; line-height: 1.5; color: var(--muted); min-height: 52px; }
  .log div:last-child { color: var(--text); }
  .mid-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .mid-right .triangle { margin: 0; }
  .end-button {
    background: linear-gradient(180deg, #f2c94c, #d9a521); color: #241a12; border: none; border-radius: 10px;
    font-size: 16px; font-weight: bold; padding: 10px 26px; box-shadow: 0 3px 0 #8a6d1f;
  }
  .end-button:hover:not(:disabled) { filter: brightness(1.08); }
  .end-button:disabled { opacity: .45; cursor: default; }

  .hand-row { display: flex; gap: 10px; justify-content: center; align-items: flex-end; min-height: 172px; }
  .bottombar { display: flex; align-items: center; gap: 16px; }
  .keys-hint { margin-left: auto; color: var(--muted); font-size: 12px; }

  /* ---------- cards ---------- */
  .card {
    position: relative; width: 118px; height: 166px; flex: none;
    border-radius: 10px; border: 2px solid #6b5a44; cursor: pointer;
    background: linear-gradient(180deg, #2e2113 0%, #1d150e 100%);
    box-shadow: 0 4px 12px rgba(0,0,0,.55);
    transition: transform .12s ease, box-shadow .12s ease, outline-color .12s ease;
    user-select: none;
  }
  .board-row .card { width: 104px; height: 148px; }
  .card.aff-ember { border-color: #e8590c; }
  .card.aff-thorn { border-color: #2f9e44; }
  .card.aff-tide { border-color: #1971c2; }
  .card .cost {
    position: absolute; top: 5px; left: 5px; z-index: 2;
    width: 26px; height: 26px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffe8a3, #d9a521);
    color: #241a12; font-weight: bold; font-size: 15px; line-height: 26px; text-align: center;
    box-shadow: 0 2px 4px rgba(0,0,0,.5);
  }
  .card .guard {
    position: absolute; top: 7px; right: 5px; z-index: 2;
    background: #adb5bd; color: #212529; font-size: 9px; font-weight: bold; letter-spacing: .08em;
    border-radius: 4px; padding: 2px 5px;
  }
  .card .art { display: block; height: 62px; margin: 26px 10px 2px; border-radius: 8px; background: radial-gradient(circle at 50% 60%, rgba(255,255,255,.14), rgba(0,0,0,.35)); }
  .board-row .card .art { height: 54px; margin-top: 24px; }
  .card .art svg { width: 100%; height: 100%; }
  .card-name { display: block; text-align: center; font-family: Georgia, serif; font-weight: bold; font-size: 13.5px; padding: 0 6px; line-height: 1.15; }
  .board-row .card .card-name { font-size: 12.5px; }
  .card-text { display: block; text-align: center; font-size: 10.5px; font-style: italic; color: var(--muted); padding: 3px 8px 0; line-height: 1.3; }
  .board-row .card .card-text { display: none; }
  .card .stat {
    position: absolute; bottom: 6px; width: 26px; height: 26px; border-radius: 50%;
    font-weight: bold; font-size: 15px; line-height: 26px; text-align: center; color: #fff;
    box-shadow: 0 2px 4px rgba(0,0,0,.5);
  }
  .card .stat.atk { left: 6px; background: radial-gradient(circle at 35% 30%, #ffa94d, #d9480f); }
  .card .stat.hp { right: 6px; background: radial-gradient(circle at 35% 30%, #ff6b6b, #c92a2a); }
  .card .stat.spell { left: 50%; margin-left: -13px; background: radial-gradient(circle at 35% 30%, #da77f2, #862e9c); }
  .card.is-guard { box-shadow: 0 0 0 2px #adb5bd inset, 0 4px 12px rgba(0,0,0,.55); }
  .card.is-playable { transform: translateY(-6px); box-shadow: 0 0 0 2px var(--gold), 0 10px 20px rgba(0,0,0,.6); }
  .card.is-selected { transform: translateY(-12px); box-shadow: 0 0 0 3px var(--gold), 0 0 22px rgba(242,201,76,.7); }
  .card.is-attacker { box-shadow: 0 0 0 2px #69db7c, 0 4px 12px rgba(0,0,0,.55); }
  .card.is-dim { opacity: .5; }
  .card.is-target { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 2px var(--gold), 0 0 6px rgba(242,201,76,.4); }
    50% { box-shadow: 0 0 0 4px var(--gold), 0 0 20px rgba(242,201,76,.9); }
  }
  .card.back {
    background: repeating-linear-gradient(45deg, #3d2a16 0 8px, #241a12 8px 16px);
    border-color: var(--gold); display: flex; align-items: center; justify-content: center; cursor: default;
  }
  .back-mark { color: var(--gold); font-size: 26px; }
  .hero.is-target { animation: pulse 1s ease-in-out infinite; }

  /* ---------- game over ---------- */
  .over-screen { align-items: center; justify-content: center; text-align: center;
    background: radial-gradient(ellipse at 50% 30%, #3d2a16 0%, #14100c 65%); }
  .over-inner { max-width: 640px; padding: 32px; }
  .over-kicker { letter-spacing: .25em; text-transform: uppercase; color: var(--gold); font-size: 13px; }
  .over-screen h1 { font-family: Georgia, serif; font-size: 84px; margin: 10px 0; line-height: 1; }
  .over-inner.won h1 { color: #ffd43b; text-shadow: 0 0 44px rgba(242,201,76,.5); }
  .over-inner.lost h1 { color: #9775fa; text-shadow: 0 0 44px rgba(112,72,232,.5); }
  .over-score { font-family: Georgia, serif; font-size: 20px; }
  .over-line { color: var(--muted); font-size: 15px; margin-bottom: 22px; }

  @media (max-width: 900px) {
    .title-screen h1 { font-size: 52px; }
    .card { width: 96px; height: 140px; }
    .board-row .card { width: 88px; height: 126px; }
    .hero { min-width: 0; }
    .lifebar { width: 90px; }
    .keys-hint { display: none; }
  }
</style>
</head>
<body>
<div id="app"></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
